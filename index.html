<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1628">
<title>HICOM Assistant</title>

<!-- Lottie player (only external dependency besides the chat API) -->
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

<style>
/* ==========================================================================
   HICOM Assistant — internal AI assistant
   Palette: bg #0a1628 · navy #1B3A6B · gold #F5A623
   ========================================================================== */

:root{
  --bg:        #0a1628;
  --bg-mid:    #0D2545;
  --navy:      #1B3A6B;
  --gold:      #F5A623;
  --card:      rgba(255,255,255,0.06);
  --border:    rgba(255,255,255,0.12);
  --chat-bg:   #ECEEF1;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
n8n
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  height:100%;
  overflow:hidden;                       /* screens scroll internally, page never does */
}

body{
  font-family: var(--font);
  background: var(--bg);
  color:#fff;
  overscroll-behavior:none;
}

/* App shell — mobile first (390px), centred and framed on wider screens */
#app{
  position:relative;
  width:100%;
  max-width:480px;
  height:100%;
  height:100dvh;                         /* avoids mobile browser chrome overlap */
  margin:0 auto;
  overflow:hidden;
  background: linear-gradient(160deg,#0a1628 0%,#0D2545 50%,#0a1628 100%);
  box-shadow:0 0 60px rgba(0,0,0,.6);
}

/* ==========================================================================
   1. PARTICLE BACKGROUND (canvas, sits behind everything)
   ========================================================================== */
#particles{
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
}

/* ---- Die casting plant photo, pushed back to read as texture ---- */
.plant-bg{
  position:absolute;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
}
.plant-bg img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 46%;      /* keeps the molten glow near the robot */
  filter: blur(1.8px) saturate(.85) brightness(.82) contrast(1.04);
  opacity:.5;
  transform-origin:52% 48%;
  animation: plantDrift 26s ease-in-out infinite alternate;
}
@keyframes plantDrift{
  from{ transform: scale(1.04); }
  to  { transform: scale(1.14); }
}
/* Navy wash + vignette so the header, greeting and footer stay readable */
.plant-bg::after{
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 44%,
      rgba(10,22,40,0)   0%,
      rgba(10,22,40,.32) 50%,
      rgba(10,22,40,.88) 82%),
    linear-gradient(180deg,
      rgba(10,22,40,.82) 0%,
      rgba(13,37,69,.16) 44%,
      rgba(10,22,40,.92) 100%);
}

/* ==========================================================================
   2. SCREENS
   ========================================================================== */
.screen{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  flex-direction:column;
}

/* Chat screen slides in from the right */
#chatScreen{
  z-index:4;
  transform: translateX(100%);
  transition: transform .4s cubic-bezier(.32,.72,.24,1);
  background: linear-gradient(180deg,#12294a 0%,#0a1628 46%,#0a1628 100%);
  will-change: transform;
}
#chatScreen.open{ transform: translateX(0); }

/* ==========================================================================
   3. HOME SCREEN
   ========================================================================== */
#homeScreen{
  padding: 14px 18px calc(10px + env(safe-area-inset-bottom));
  padding-top: calc(14px + env(safe-area-inset-top));
  justify-content:space-between;
  text-align:center;
}

/* ---- Top header ---- */
.home-header{ flex:0 0 auto; }

.brand-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.brand-logo{
  display:flex;
  align-items:center;
  padding:5px 10px;
  background: rgba(255,255,255,.93);
  border-radius:9px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 3px 14px rgba(0,0,0,.35);
}
.brand-logo img{ height:20px; width:auto; display:block; }

.brand-sub{
  font-size:12.5px;
  color: rgba(255,255,255,.55);
  font-weight:500;
}

.brand-tag{
  margin-top:7px;
  font-size:10.5px;
  letter-spacing:2.4px;
  text-transform:uppercase;
  color: var(--gold);
  opacity:.85;
  font-weight:600;
}

/* ---- Robot + orbit rings ---- */
.robot-stage{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:0;                          /* lets the stage shrink on short screens */
}

.orbit-wrap{
  position:relative;
  width:280px;
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Radial gold glow pulsing behind the robot */
.glow-pulse{
  position:absolute;
  width:210px;
  height:210px;
  border-radius:50%;
  background: radial-gradient(circle,
              rgba(245,166,35,.55) 0%,
              rgba(245,166,35,.22) 42%,
              rgba(245,166,35,0)   72%);
  animation: glowPulse 2.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes glowPulse{
  0%,100%{ transform: scale(1);    opacity:.3; }
  50%    { transform: scale(1.15); opacity:.7; }
}

/* Orbit rings */
.ring{
  position:absolute;
  border-radius:50%;
  /* 20% gold on the border colour rather than element opacity, so the orbit
     dots below keep their full brightness and glow. */
  border:1.5px solid rgba(245,166,35,.2);
  pointer-events:none;
}
.ring-outer{
  width:280px; height:280px;
  animation: spin 10s linear infinite;         /* clockwise */
}
.ring-inner{
  width:200px; height:200px;
  animation: spinReverse 8s linear infinite;   /* counter-clockwise */
  border-style:dashed;
}
@keyframes spin       { from{ transform: rotate(0deg); } to{ transform: rotate(360deg);  } }
@keyframes spinReverse{ from{ transform: rotate(0deg); } to{ transform: rotate(-360deg); } }

/* 4 glowing dots pinned at N/S/E/W — children of the ring so they ride its rotation */
.orbit-dot{
  position:absolute;
  width:7px; height:7px;
  border-radius:50%;
  background: var(--gold);
  box-shadow:0 0 10px 2px rgba(245,166,35,.9);
}
.orbit-dot.n{ top:-4px;   left:50%; transform: translateX(-50%); }
.orbit-dot.s{ bottom:-4px; left:50%; transform: translateX(-50%); }
.orbit-dot.e{ right:-4px;  top:50%;  transform: translateY(-50%); }
.orbit-dot.w{ left:-4px;   top:50%;  transform: translateY(-50%); }

/* Lottie robot */
#robotBtn{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  background:none;
  border:none;
  cursor:pointer;
  padding:0;
}
lottie-player{
  display:block;
  filter: drop-shadow(0 6px 24px rgba(245,166,35,.25));
}
/* Tap reaction */
lottie-player.bounce{ animation: robotBounce .3s ease; }
@keyframes robotBounce{
  0%  { transform: scale(1);   }
  35% { transform: scale(.94); }
  70% { transform: scale(1.04);}
  100%{ transform: scale(1);   }
}

/* Static stand-in if the Lottie can neither be fetched nor inlined */
#robotFallback{
  display:none;
  font-size:86px;
  line-height:1;
  filter: drop-shadow(0 6px 24px rgba(245,166,35,.35));
}
#robotFallback.bounce{ animation: robotBounce .3s ease; }

.tap-hint{
  margin-top:14px;
  text-shadow:0 1px 6px rgba(10,22,40,.9);
  font-size:12.5px;
  color: rgba(255,255,255,.8);
  animation: hintFade 2s ease-in-out infinite;
}
@keyframes hintFade{
  0%,100%{ opacity:.5; }
  50%    { opacity:1;  }
}

/* ---- Rotating multilingual greeting ---- */
.greeting{
  margin-top:20px;
  min-height:64px;                       /* fixed box so the layout never jumps */
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.greet-main{
  /* Explicit stack so Bangla, Chinese and Arabic all find a system face */
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali",
               "Noto Sans SC", "Microsoft YaHei", "Segoe UI Emoji", Roboto, sans-serif;
  font-size:27px;
  font-weight:700;
  line-height:1.3;
  color:#fff;
  text-shadow:0 2px 20px rgba(245,166,35,.45);
}

.greet-sub{
  margin-top:6px;
  text-shadow:0 1px 6px rgba(10,22,40,.9);
  font-size:9.5px;
  letter-spacing:2.2px;
  text-transform:uppercase;
  font-weight:600;
  color: var(--gold);
  opacity:.9;
}

/* Both lines fade + rise together; JS toggles .show on the wrapper */
.greet-main,
.greet-sub{
  opacity:0;
  transform: translateY(9px);
  transition: opacity .5s ease, transform .5s ease;
}
.greeting.show .greet-main,
.greeting.show .greet-sub{
  opacity:1;
  transform: translateY(0);
}
.greeting.show .greet-sub{ transition-delay:.07s; }

/* ---- Footer ---- */
.home-footer{
  flex:0 0 auto;
  font-size:10.5px;
  color: rgba(255,255,255,.35);
}

/* ==========================================================================
   4. CHAT SCREEN — header
   ========================================================================== */
.chat-header{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 14px 24px;                /* deep bottom padding gives the fade room */
  padding-top: calc(12px + env(safe-area-inset-top));
  /* Dissolves into the message area rather than stopping on a hard line */
  background: linear-gradient(180deg,
              rgba(30,64,116,.98) 0%,
              rgba(21,48,90,.80)  42%,
              rgba(12,28,52,.34)  74%,
              rgba(10,22,40,0)    100%);
  z-index:2;
}

/* HICOM wordmark on a light chip so the indigo mark reads on the dark banner */
.brand-chip{
  width:34px; height:34px;
  flex:0 0 34px;
  border-radius:10px;
  background: rgba(255,255,255,.93);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:4px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 3px 12px rgba(0,0,0,.3);
}
.brand-chip img{ width:100%; height:auto; display:block; }

.icon-btn{
  background:none;
  border:none;
  color:#fff;
  font-size:20px;
  line-height:1;
  padding:6px 8px;
  border-radius:10px;
  cursor:pointer;
  transition: background .18s ease;
}
.icon-btn:active{ background: rgba(255,255,255,.14); }

.bot-avatar{
  width:36px; height:36px;
  flex:0 0 36px;
  border-radius:50%;
  background: var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  box-shadow:0 0 10px rgba(245,166,35,.4);
}

.header-meta{ flex:1 1 auto; min-width:0; }
.header-title{ font-size:14.5px; font-weight:700; color:#fff; }
.header-status{
  font-size:10.5px;
  color: rgba(255,255,255,.65);
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:1px;
}
.status-dot{
  width:7px; height:7px;
  border-radius:50%;
  background:#4CAF50;
  box-shadow:0 0 6px #4CAF50;
}

/* ==========================================================================
   5. CHAT SCREEN — messages
   ========================================================================== */
#messages{
  flex:1 1 auto;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  background: transparent;
  padding:6px 12px 16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* Every message animates in */
.msg-row{
  display:flex;
  align-items:flex-end;
  gap:7px;
  max-width:100%;
  animation: msgIn .3s ease both;
}
@keyframes msgIn{
  from{ opacity:0; transform: translateY(10px); }
  to  { opacity:1; transform: translateY(0);    }
}
.msg-row.bot { justify-content:flex-start; align-items:flex-start; }
.msg-row.user{ justify-content:flex-end;   }

/* Small avatar beside the first bot message of a group */
.msg-avatar{
  width:28px; height:28px;
  flex:0 0 28px;
  border-radius:50%;
  overflow:hidden;
  background: rgba(255,255,255,.07);
  border:1px solid rgba(245,166,35,.42);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:1px;                        /* sits level with the top of the first bubble */
}
.msg-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 40%;               /* wide crop -> keep the face in frame */
  display:block;
}
.msg-avatar.spacer{ background:none; border:none; box-shadow:none; }

.msg-col{ max-width:80%; display:flex; flex-direction:column; }

.bubble{
  padding:9px 12px;
  font-size:13px;
  line-height:1.5;
  word-wrap:break-word;
  overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.bubble.bot{
  background: var(--card);
  border:1px solid var(--border);
  color:#e8eef7;
  border-radius:18px 18px 18px 4px;      /* flat bottom-left */
}
.bubble.user{
  /* Gold gradient is the HICOM equivalent of the reference's accent bubble */
  background: linear-gradient(135deg,#F5A623 0%,#E07C0B 100%);
  color:#1b1204;
  font-weight:500;
  border-radius:18px 18px 4px 18px;      /* flat bottom-right */
  box-shadow:0 4px 18px rgba(245,166,35,.26);
}

.stamp{
  font-size:9px;
  color: rgba(255,255,255,.34);
  margin-top:3px;
  padding:0 4px;
}
.stamp.right{ text-align:right; }

/* ---- Typing indicator ---- */
.typing{
  display:flex;
  align-items:center;
  gap:4px;
  background: var(--card);
  border:1px solid var(--border);
  border-radius:18px 18px 18px 4px;
  padding:12px 14px;
}
.typing span{
  width:6px; height:6px;
  border-radius:50%;
  background: rgba(255,255,255,.55);
  animation: typingBounce 1.3s ease-in-out infinite;
}
.typing span:nth-child(2){ animation-delay:.18s; }
.typing span:nth-child(3){ animation-delay:.36s; }
@keyframes typingBounce{
  0%,60%,100%{ transform: translateY(0);    }
  30%        { transform: translateY(-6px); }
}

/* ---- Quick reply chips ---- */
.chips{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 4px 33px;                /* indented to line up under the bot bubble */
  scrollbar-width:none;
  animation: msgIn .3s ease both;
}
.chips::-webkit-scrollbar{ display:none; }

.chip{
  flex:0 0 auto;
  background: rgba(255,255,255,.06);
  border:1px solid rgba(245,166,35,.45);
  color: var(--gold);
  font-family:inherit;
  font-size:10px;
  font-weight:600;
  padding:7px 12px;
  border-radius:999px;
  white-space:nowrap;
  cursor:pointer;
  transition: background .18s ease, color .18s ease, transform .15s ease;
}
.chip:active{ transform: scale(.97); background: var(--gold); color:#0a1628; }

/* ==========================================================================
   6. SPECIAL MESSAGE CARDS
   ========================================================================== */
.card{
  background: var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:11px 12px;
  margin-top:6px;
  animation: msgIn .3s ease both;
}
.card-title{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:13px;
  font-weight:700;
  color:#f2f6fc;
}
.card-text{
  font-size:12.5px;
  line-height:1.5;
  color: rgba(255,255,255,.75);
  margin-top:6px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.card-badge{
  display:inline-block;
  margin-top:9px;
  font-size:9.5px;
  font-weight:600;
  color: rgba(255,255,255,.6);
  background: rgba(255,255,255,.09);
  border-radius:999px;
  padding:3px 9px;
}

/* Booking = green rail · Security = red rail */
.card.booking { border-left:4px solid #4CAF50; }
.card.security{ border-left:4px solid #E53935; }

/* ---- Map card ---- */
.card.map{ padding:11px; }
.map-label{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:700;
  color: var(--gold);
  margin-bottom:8px;
}
.map-frame{
  position:relative;
  min-height:120px;
  border-radius:10px;
  overflow:hidden;
  background: rgba(255,255,255,.05);
  display:flex;
  align-items:center;
  justify-content:center;
}
.map-frame img{
  display:block;
  width:100%;
  height:auto;
  border-radius:10px;
}
.map-frame img.loading{ display:none; }

/* Spinner shown while the map image downloads */
.spinner{
  width:24px; height:24px;
  border:2.5px solid rgba(255,255,255,.16);
  border-top-color: var(--gold);
  border-radius:50%;
  animation: spin .8s linear infinite;
}
.map-error{
  font-size:12px;
  color: rgba(255,255,255,.45);
  padding:22px 10px;
  text-align:center;
}

/* ---- Error + retry ---- */
.retry-btn{
  align-self:flex-start;
  margin-top:6px;
  background: var(--gold);
  color:#0a1628;
  border:none;
  font-family:inherit;
  font-size:11px;
  font-weight:700;
  padding:6px 15px;
  border-radius:999px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(245,166,35,.35);
  transition: transform .15s ease, opacity .2s ease;
}
.retry-btn:active{ transform: scale(.96); }
.retry-btn[disabled]{ opacity:.5; cursor:default; }

/* ==========================================================================
   7. INPUT BAR
   ========================================================================== */
.input-bar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:8px;
  /* Mirrors the header: fades up into the conversation */
  background: linear-gradient(180deg, rgba(10,22,40,0) 0%, rgba(10,22,40,.94) 34%, #0a1628 100%);
  padding:18px 12px 10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
}

#chatInput{
  flex:1 1 auto;
  min-width:0;
  border:1px solid var(--border);
  background: var(--card);
  border-radius:999px;
  padding:11px 16px;
  font-family:inherit;
  font-size:13.5px;
  color:#eaf0f8;
  outline:none;
  transition: border-color .2s ease, background .2s ease;
}
#chatInput::placeholder{ color: rgba(255,255,255,.38); }
#chatInput:focus{ border-color: rgba(245,166,35,.55); background: rgba(255,255,255,.09); }
#chatInput:disabled{ opacity:.6; }

#sendBtn{
  flex:0 0 38px;
  width:38px; height:38px;
  border:none;
  border-radius:50%;
  background: rgba(255,255,255,.13);     /* muted while empty */
  color: rgba(255,255,255,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:default;
  transition: background .2s ease, transform .15s ease, box-shadow .2s ease;
}
#sendBtn.active{
  background: var(--gold);
  color:#0a1628;
  cursor:pointer;
  box-shadow:0 2px 10px rgba(245,166,35,.4);
}
#sendBtn.active:active{ transform: scale(.93); }
#sendBtn svg{ width:18px; height:18px; }

/* ==========================================================================
   8. RESPONSIVE / ACCESSIBILITY
   ========================================================================== */
@media (min-width:481px){
  body{ background:#060e1c; }
  #app{ border-left:1px solid rgba(255,255,255,.06); border-right:1px solid rgba(255,255,255,.06); }
}

/* Short screens: shrink the orbit stage so the action grid still fits */
@media (max-height:720px){
  .orbit-wrap{ transform: scale(.86); }
  .greeting{ min-height:54px; margin-top:12px; }
  .greet-main{ font-size:22px; }
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>

<body>
<div id="app">

  <!-- Die casting plant backdrop, behind every screen -->
  <div class="plant-bg" aria-hidden="true">
    <img src="diecast.png" alt="">
  </div>

  <!-- Drifting particle field -->
  <canvas id="particles"></canvas>

  <!-- ====================================================================
       PAGE 1 — HOME
       ==================================================================== -->
  <section id="homeScreen" class="screen">

    <header class="home-header">
      <div class="brand-row">
        <span class="brand-logo"><img src="logo.png" alt="HICOM"></span>
        <span class="brand-sub">Diecastings Sdn. Bhd.</span>
      </div>
      <div class="brand-tag">Internal AI Assistant</div>
    </header>

    <div class="robot-stage">
      <div class="orbit-wrap">
        <!-- Pulsing radial glow -->
        <div class="glow-pulse"></div>

        <!-- Outer ring (clockwise) with N/S/E/W dots riding along -->
        <div class="ring ring-outer">
          <i class="orbit-dot n"></i>
          <i class="orbit-dot s"></i>
          <i class="orbit-dot e"></i>
          <i class="orbit-dot w"></i>
        </div>

        <!-- Inner ring (counter-clockwise) -->
        <div class="ring ring-inner"></div>

        <!-- The Lottie robot -->
        <button id="robotBtn" aria-label="Open chat with HICOM Assistant">
          <lottie-player
            id="robotPlayer"
            src="robot.json"
            background="transparent"
            speed="1"
            style="width: 240px; height: 240px;"
            loop
            autoplay>
          </lottie-player>
          <div id="robotFallback">&#129302;</div>
        </button>
      </div>

      <!-- Cycles through Hi / Salam Alaikum / Bangla / Chinese / Malay -->
      <div class="greeting" id="greeting">
        <span class="greet-main"></span>
        <span class="greet-sub"></span>
      </div>

      <div class="tap-hint">&#128070; tap to start</div>
    </div>

    <footer class="home-footer">&#128737;&#65039; Powered by HICOM AI &middot; Available 24/7</footer>
  </section>

  <!-- ====================================================================
       PAGE 2 — CHAT
       ==================================================================== -->

<script>
/* ==========================================================================
   HICOM Assistant — application script
   Sections: config · session · particles · robot · navigation ·
             message rendering · API · input handling
   ========================================================================== */
(function () {
  'use strict';

  /* ---------------------------------------------------------------- config */
  const API_URL = 'https://hdsb.app.n8n.cloud/webhook/hicom-chat';

  const WELCOME_TEXT =
    "👋 Welcome to HICOM Diecastings! I'm your AI assistant. " +
    "Ask me anything about IT, HR, Safety, or how to find your way around the plant.";

  const ERROR_TEXT =
    "⚠️ I'm having trouble connecting right now. Please try again in a moment.";

  // Cycled on the home screen. Malay is included since the plant is in Malaysia.
  const GREETINGS = [
    { text: 'Hi 👋',            label: 'English' },
    { text: 'Apa khabar',                   label: 'Bahasa Melayu' },
    { text: 'السلام عليكم', label: 'Salam Alaikum' },
    { text: 'নমস্কার', label: 'Nomoskar · Bangla' },
    { text: '你好',               label: 'Nǐ hǎo · 中文' },
    { text: 'Apa khabar',                   label: 'Bahasa Melayu' },
    { text: 'How can I help you?',          label: 'Ask me anything' }
  ];

  const QUICK_REPLIES = [
    '📍 Where is HR office?',
    '🔑 How to reset password?',
    '⛑️ PPE rules for casting area',
    '📋 First day checklist'
  ];

  /* --------------------------------------------------------------- session */
  // One id per browser tab, reused for every request so n8n can thread context.
  const sessionId = sessionStorage.getItem('hicom_session') || newSessionId();
  sessionStorage.setItem('hicom_session', sessionId);

  function newSessionId() {
    if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    // Fallback for browsers without crypto.randomUUID (or non-secure contexts).
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  /* ------------------------------------------------------------------- dom */
  function $(id) { return document.getElementById(id); }

  const homeScreen  = $('homeScreen');
  const chatScreen  = $('chatScreen');
  const messagesEl  = $('messages');
  const chatInput   = $('chatInput');
  const sendBtn     = $('sendBtn');
  const robotBtn    = $('robotBtn');
  const robotPlayer = $('robotPlayer');
  const robotStatic = $('robotFallback');

  /* ----------------------------------------------------------------- state */
  const state = {
    welcomed: false,       // welcome bubble already rendered?
    busy: false,           // an API call is in flight
    lastUserMessage: null, // used by the Retry button
    lastBotRow: null       // used to group consecutive bot messages under one avatar
  };

  /* ==========================================================================
     PARTICLES — slow upward drift, fading as they rise
     ========================================================================== */
  (function initParticles() {
    const canvas = $('particles');
    const ctx = canvas.getContext('2d');
    let dots = [];
    let w = 0, h = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.clientWidth;
      h = canvas.clientHeight;
      canvas.width  = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function seed() {
      dots = [];
      for (let i = 0; i < 26; i++) {
        dots.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.5 + 0.6,
          speed: Math.random() * 0.28 + 0.10,
          alpha: Math.random() * 0.22 + 0.10,
          drift: (Math.random() - 0.5) * 0.12
        });
      }
    }

    function frame() {
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < dots.length; i++) {
        const d = dots[i];
        d.y -= d.speed;
        d.x += d.drift;

        // Fade out across the top third, then respawn at the bottom.
        const fade = d.y < h * 0.33 ? Math.max(d.y / (h * 0.33), 0) : 1;
        if (d.y < -10) { d.y = h + 10; d.x = Math.random() * w; }

        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + (d.alpha * fade).toFixed(3) + ')';
        ctx.fill();
      }
      requestAnimationFrame(frame);
    }

    resize();
    seed();
    frame();
    window.addEventListener('resize', function () { resize(); seed(); });
  })();

  /* ==========================================================================
     GREETING — fades one language in, holds, fades out, moves to the next
     ========================================================================== */
  (function initGreeting() {
    const box  = $('greeting');
    const main = box.querySelector('.greet-main');
    const sub  = box.querySelector('.greet-sub');
    let i = 0;

    const HOLD = 2400;   // visible time
    const GAP  = 620;    // fade-out before the next one swaps in

    function show() {
      const g = GREETINGS[i];
      main.textContent = g.text;
      sub.textContent  = g.label;
      // Arabic needs RTL so its text renders in the right order.
      main.dir = /[؀-ۿ]/.test(g.text) ? 'rtl' : 'ltr';

      box.classList.add('show');
      setTimeout(function () {
        box.classList.remove('show');
        i = (i + 1) % GREETINGS.length;
        setTimeout(show, GAP);
      }, HOLD);
    }

    show();
  })();

  /* ==========================================================================
     ROBOT — Lottie load, with graceful degradation
     ========================================================================== */
  (function initRobot() {
    let recovered = false;

    // Chrome blocks fetching robot.json from a file:// page, so if the player
    // cannot load it we feed it the copy inlined in this document instead.
    function useInlineData() {
      if (recovered) return;
      recovered = true;
      try {
        const raw = $('robotFallbackData').textContent.trim();
        if (!raw || raw.charAt(0) !== '{') throw new Error('no inline animation');
        robotPlayer.load(JSON.parse(raw));
      } catch (err) {
        // Nothing left to try — show the static emoji robot.
        robotPlayer.style.display = 'none';
        robotStatic.style.display = 'block';
      }
    }

    robotPlayer.addEventListener('error', useInlineData);

    // Some builds swallow the error event, so verify something actually rendered.
    setTimeout(function () {
      const drawn = robotPlayer.shadowRoot && robotPlayer.shadowRoot.querySelector('svg, canvas');
      if (!drawn) useInlineData();
    }, 1500);

    // If the custom element never upgrades (CDN blocked), go straight to static.
    setTimeout(function () {
      if (typeof customElements === 'undefined' || !customElements.get('lottie-player')) {
        robotPlayer.style.display = 'none';
        robotStatic.style.display = 'block';
      }
    }, 2600);
  })();

  function bounceRobot() {
    const el = robotStatic.style.display === 'block' ? robotStatic : robotPlayer;
    el.classList.remove('bounce');
    void el.offsetWidth;              // reflow so the animation can restart
    el.classList.add('bounce');
    setTimeout(function () { el.classList.remove('bounce'); }, 320);
  }

  /* ==========================================================================
     NAVIGATION — home <-> chat
     ========================================================================== */
  function openChat() {
    chatScreen.classList.add('open');
    chatScreen.setAttribute('aria-hidden', 'false');
    homeScreen.setAttribute('aria-hidden', 'true');

    // The welcome message is rendered once; history is never cleared.
    if (!state.welcomed) {
      state.welcomed = true;
      addBotBubble(WELCOME_TEXT);
      renderChips();
    }

    setTimeout(scrollToBottom, 420);
  }

  function closeChat() {
    chatScreen.classList.remove('open');
    chatScreen.setAttribute('aria-hidden', 'true');
    homeScreen.setAttribute('aria-hidden', 'false');
    chatInput.blur();
  }

  robotBtn.addEventListener('click', function () {
    bounceRobot();
    openChat();
  });

  $('backBtn').addEventListener('click', closeChat);

  // Hardware/browser back closes the chat rather than leaving the app.
  window.addEventListener('popstate', function () {
    if (chatScreen.classList.contains('open')) closeChat();
  });

  /* ==========================================================================
     MESSAGE RENDERING
     ========================================================================== */
  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function stamp(right) {
    return el('div', 'stamp' + (right ? ' right' : ''), 'Just now');
  }

  /**
   * Creates a bot row [avatar][column] and returns the column to fill.
   * Consecutive bot rows get a blank spacer instead of a second avatar so a
   * group of bot messages reads as one block.
   */
  function botRow() {
    const row = el('div', 'msg-row bot');
    const grouped = state.lastBotRow !== null && state.lastBotRow === messagesEl.lastElementChild;

    const avatar = el('div', 'msg-avatar' + (grouped ? ' spacer' : ''));
    if (!grouped) {
      const face = document.createElement('img');
      face.src = 'robot_icon.png';
      face.alt = '';
      avatar.appendChild(face);
    }

    const col = el('div', 'msg-col');
    row.appendChild(avatar);
    row.appendChild(col);
    messagesEl.appendChild(row);
    state.lastBotRow = row;
    scrollToBottom();
    return col;
  }

  function addBotBubble(text) {
    const col = botRow();
    col.appendChild(el('div', 'bubble bot', text));
    col.appendChild(stamp(false));
    scrollToBottom();
    return col;
  }

  function addUserBubble(text) {
    const row = el('div', 'msg-row user');
    const col = el('div', 'msg-col');
    col.appendChild(el('div', 'bubble user', text));
    col.appendChild(stamp(true));
    row.appendChild(col);
    messagesEl.appendChild(row);
    state.lastBotRow = null;              // next bot message starts a fresh group
    scrollToBottom();
  }

  /* ---- Quick reply chips (only under the welcome message) ---- */
  function renderChips() {
    const wrap = el('div', 'chips');
    wrap.id = 'quickChips';
    QUICK_REPLIES.forEach(function (label) {
      const chip = el('button', 'chip', label);
      chip.addEventListener('click', function () {
        if (state.busy) return;
        sendMessage(label);
      });
      wrap.appendChild(chip);
    });
    messagesEl.appendChild(wrap);
    state.lastBotRow = null;
    scrollToBottom();
  }

  function removeChips() {
    const chips = $('quickChips');
    if (chips && chips.parentNode) chips.parentNode.removeChild(chips);
  }

  /* ---- Typing indicator ---- */
  function showTyping() {
    const col = botRow();
    const dots = el('div', 'typing');
    dots.appendChild(el('span'));
    dots.appendChild(el('span'));
    dots.appendChild(el('span'));
    col.appendChild(dots);
    col.parentNode.id = 'typingRow';
    scrollToBottom();
  }

  function hideTyping() {
    const row = $('typingRow');
    if (!row) return;
    if (state.lastBotRow === row) state.lastBotRow = null;
    row.parentNode.removeChild(row);
  }

  /* ---- MAP card ---- */
  function addMapCard(col, data) {
    const card = el('div', 'card map');

    const label = el('div', 'map-label');
    label.appendChild(el('span', null, '📍'));
    label.appendChild(el('span', null, data.location || data.place || data.department || 'Location'));
    card.appendChild(label);

    const frame = el('div', 'map-frame');
    const spinner = el('div', 'spinner');
    const img = document.createElement('img');
    img.className = 'loading';
    img.alt = 'Map';

    img.addEventListener('load', function () {
      img.classList.remove('loading');
      if (spinner.parentNode) spinner.parentNode.removeChild(spinner);
      scrollToBottom();
    });
    img.addEventListener('error', function () {
      if (spinner.parentNode) spinner.parentNode.removeChild(spinner);
      if (img.parentNode) img.parentNode.removeChild(img);
      frame.appendChild(el('div', 'map-error', '📍 Map image unavailable'));
      scrollToBottom();
    });

    frame.appendChild(spinner);
    frame.appendChild(img);
    card.appendChild(frame);
    col.appendChild(card);

    img.src = data.imageUrl;              // set last, after the handlers are attached
    scrollToBottom();
  }

  /* ---- Booking / Security cards ---- */
  function addStatusCard(col, kind, icon, title, text, badge) {
    const card = el('div', 'card ' + kind);

    const head = el('div', 'card-title');
    head.appendChild(el('span', null, icon));
    head.appendChild(el('span', null, title));
    card.appendChild(head);

    if (text) card.appendChild(el('div', 'card-text', text));
    card.appendChild(el('span', 'card-badge', badge));

    col.appendChild(card);
    col.appendChild(stamp(false));
    scrollToBottom();
  }

  /* ---- Error bubble with Retry ---- */
  function addErrorBubble() {
    const col = botRow();
    col.appendChild(el('div', 'bubble bot', ERROR_TEXT));

    const retry = el('button', 'retry-btn', 'Retry');
    retry.addEventListener('click', function () {
      if (state.busy || !state.lastUserMessage) return;
      retry.disabled = true;
      retry.textContent = 'Retrying…';
      callApi(state.lastUserMessage);
    });
    col.appendChild(retry);
    col.appendChild(stamp(false));
    scrollToBottom();
  }

  /* ==========================================================================
     RESPONSE DISPATCH — one branch per response type
     ========================================================================== */
  function renderResponse(data) {
    const text = data && data.response ? String(data.response) : '';
    const type = data && data.type ? String(data.type).toUpperCase() : 'QA';

    switch (type) {
      case 'MAP': {
        // Text bubble always; the map card only when an image actually exists.
        const col = addBotBubble(text || 'Here is the location.');
        if (data.imageFound && data.imageUrl) addMapCard(col, data);
        break;
      }

      case 'BOOKING':
        addStatusCard(botRow(), 'booking', '✅', 'Meeting Request Sent', text, 'Department notified');
        break;

      case 'SECURITY':
        addStatusCard(botRow(), 'security', '🚨', 'Security Team Alerted', text, 'Report logged');
        break;

      // QA and FALLBACK both render as a plain bubble.
      default:
        addBotBubble(text || "I didn't quite catch that — could you rephrase?");
    }
  }

  /* ==========================================================================
     API
     ========================================================================== */
  function setBusy(busy) {
    state.busy = busy;
    chatInput.disabled = busy;
    updateSendButton();
  }

  function callApi(message) {
    setBusy(true);
    showTyping();

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message, sessionId: sessionId })
    })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        hideTyping();
        // n8n may return the payload wrapped in an array or nested under `data`.
        if (Array.isArray(data)) data = data[0] || {};
        if (data && data.data && data.response === undefined) data = data.data;
        renderResponse(data);
      })
      .catch(function (err) {
        hideTyping();
        console.error('[HICOM] chat request failed:', err);
        addErrorBubble();
      })
      .then(function () {
        setBusy(false);
        scrollToBottom();
      });
  }

  /* ==========================================================================
     SENDING
     ========================================================================== */
  function sendMessage(text) {
    const message = String(text || '').trim();
    if (!message || state.busy) return;

    removeChips();                     // chips disappear once a real message is sent
    state.lastUserMessage = message;

    addUserBubble(message);
    chatInput.value = '';
    updateSendButton();
    callApi(message);
  }

  /* ==========================================================================
     INPUT HANDLING
     ========================================================================== */
  function updateSendButton() {
    const ready = chatInput.value.trim().length > 0 && !state.busy;
    sendBtn.classList.toggle('active', ready);
    sendBtn.disabled = !ready;
  }

  chatInput.addEventListener('input', updateSendButton);

  chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage(chatInput.value);
    }
  });

  sendBtn.addEventListener('click', function () {
    sendMessage(chatInput.value);
  });

  // Keep the newest message visible when the mobile keyboard opens.
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      if (chatScreen.classList.contains('open')) scrollToBottom();
    });
  }

  updateSendButton();
})();
</script>
</body>
</html>
